<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- Mobile-first: fit to device width, allow pinch-zoom for sheet music -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="木吉他基礎班課程資料 — 投影片、樂譜與示範影片">
  <title>木吉他基礎班 ｜ 祂的敬拜學院</title>
  <style>
    /* ---------- Design tokens (warm, wood-inspired palette, single accent) ---------- */
    :root {
      --accent: #C2691D;
      --accent-dark: #9E5114;
      --accent-soft: #F6E7D7;
      --bg: #FBF6F0;
      --card: #FFFFFF;
      --text: #2B2420;
      --muted: #8A7E74;
      --line: #ECE3D9;
      --radius: 16px;
      --shadow: 0 2px 10px rgba(74, 53, 36, 0.06), 0 1px 3px rgba(74, 53, 36, 0.05);
      --sidebar-w: 300px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden; /* keep off-canvas drawer from creating sideways scroll */
    }

    /* ---------- Top app bar (mobile only) ---------- */
    .appbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(251, 246, 240, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      padding: 8px 14px;
      background: #fff;
      border: 1.5px solid var(--accent);
      color: var(--accent-dark);
      font: inherit;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
    .menu-btn .bars { font-size: 1.1rem; line-height: 1; }
    .appbar-title { font-weight: 800; font-size: 1.05rem; }

    /* ---------- Layout: sidebar + main ---------- */
    .layout { display: flex; align-items: flex-start; }

    .sidebar {
      background: var(--card);
      padding: 20px 14px;
      overflow-y: auto;
    }
    .brand { text-align: center; padding: 6px 6px 16px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .brand .academy { color: var(--accent); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.12em; margin: 0 0 6px; }
    .brand .class-title { font-size: 1.4rem; font-weight: 800; margin: 0 0 6px; }
    .brand .church { color: var(--muted); font-size: 0.82rem; margin: 0; }

    .nav-label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); padding: 0 8px 8px; }
    .lesson-nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: block;
      width: 100%;
      text-align: start;
      font: inherit;
      line-height: 1.35;
      background: transparent;
      border: none;
      border-left: 3px solid transparent;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text);
    }
    .nav-item:hover { background: var(--accent-soft); }
    .nav-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
    .nav-item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .nav-item .n { display: block; font-size: 0.76rem; font-weight: 700; color: var(--accent-dark); letter-spacing: 0.04em; }
    .nav-item .ti { display: block; font-weight: 600; }
    .nav-item .dt { display: block; font-size: 0.73rem; color: var(--muted); margin-top: 1px; }

    .backdrop { position: fixed; inset: 0; background: rgba(40, 30, 20, 0.45); z-index: 35; }

    .main { flex: 1 1 auto; min-width: 0; padding: 16px; }
    .main-inner { max-width: 760px; margin: 0 auto; }

    /* ---------- Lesson card ---------- */
    .lesson { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 16px; }
    .lesson-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
    .badge { display: inline-block; background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
    .date { color: var(--muted); font-size: 0.85rem; }
    .lesson-title { font-size: 1.35rem; font-weight: 800; margin: 8px 0 4px; text-wrap: balance; }
    .lesson-desc { color: #5c5249; margin: 0 0 16px; }

    /* ---------- File items ---------- */
    .files { display: flex; flex-direction: column; gap: 12px; }
    .file { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #FCFAF7; }
    .file-name { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; word-break: break-word; }
    .file-icon { font-size: 1.15rem; line-height: 1; }

    .thumb { display: block; width: 100%; max-height: 380px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
    video.preview { display: block; width: 100%; max-height: 440px; background: #000; border-radius: 10px; margin-bottom: 10px; }

    .actions { display: flex; gap: 10px; }
    .btn { flex: 1 1 0; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer; padding: 0 12px; transition: transform 0.04s ease, background 0.15s ease; }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-ghost { background: #fff; color: var(--accent-dark); border: 1.5px solid var(--accent); }
    .btn-ghost:hover { background: var(--accent-soft); }

    /* ---------- States ---------- */
    .state { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 1.05rem; }
    .state .big { font-size: 2.2rem; display: block; margin-bottom: 10px; }

    /* ---------- Mobile: sidebar becomes an off-canvas drawer ---------- */
    @media (max-width: 879px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 84%;
        max-width: 320px;
        z-index: 40;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.22);
        border-right: 1px solid var(--line);
      }
      .sidebar.open { transform: translateX(0); }
    }

    /* ---------- Desktop: sidebar pinned open, no app bar ---------- */
    @media (min-width: 880px) {
      .appbar { display: none; }
      .backdrop { display: none !important; }
      .layout { max-width: 1100px; margin: 0 auto; }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        width: var(--sidebar-w);
        flex: 0 0 var(--sidebar-w);
        border-right: 1px solid var(--line);
      }
      .main { padding: 28px 28px 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sidebar { transition: none; }
    }
  </style>
</head>
<body>
  <!-- App bar (shown on phones; hidden on desktop where the sidebar is pinned) -->
  <div class="appbar">
    <button class="menu-btn" id="menuBtn" aria-label="開啟課程選單" aria-expanded="false" aria-controls="sidebar">
      <span class="bars" aria-hidden="true">☰</span><span>課程</span>
    </button>
    <span class="appbar-title">木吉他基礎班</span>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="課程列表">
      <div class="brand">
        <p class="academy">祂的敬拜學院</p>
        <h1 class="class-title">木吉他基礎班 🎸</h1>
        <p class="church">龍潭聖潔會</p>
      </div>
      <p class="nav-label">課程列表</p>
      <nav class="lesson-nav" id="lessonNav"><!-- lesson buttons rendered here --></nav>
    </aside>

    <main class="main" id="main" aria-live="polite">
      <div class="main-inner">
        <div class="state"><span class="big">🎵</span>課程載入中…</div>
      </div>
    </main>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Church guitar lessons — static single-lesson viewer with a lesson switcher.
    // Reads lessons.json, lists lessons in the sidebar, shows one at a time.
    // No framework, no backend. UI strings are Traditional Chinese; code English.
    // ---------------------------------------------------------------------------

    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');
    const nav = document.getElementById('lessonNav');
    const main = document.getElementById('main');

    let lessons = [];
    let activeIndex = 0;

    // ----- Drawer (mobile) -----
    const isMobile = () => window.matchMedia('(max-width: 879px)').matches;
    function openDrawer() {
      sidebar.classList.add('open');
      backdrop.hidden = false;
      menuBtn.setAttribute('aria-expanded', 'true');
    }
    function closeDrawer() {
      sidebar.classList.remove('open');
      backdrop.hidden = true;
      menuBtn.setAttribute('aria-expanded', 'false');
    }
    menuBtn.addEventListener('click', () =>
      sidebar.classList.contains('open') ? closeDrawer() : openDrawer());
    backdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

    // ----- File rendering -----
    function iconFor(type) {
      switch (type) {
        case 'pdf': return '📄';
        case 'image': return '🖼️';
        case 'video': return '🎬';
        default: return '📎';
      }
    }

    function actionButton(label, href, isDownload, downloadName) {
      const a = document.createElement('a');
      a.className = 'btn ' + (isDownload ? 'btn-primary' : 'btn-ghost');
      a.href = href;
      a.textContent = label;
      if (isDownload) {
        // Same-origin on GitHub Pages, so the browser saves to the device.
        a.setAttribute('download', downloadName || '');
      } else {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      return a;
    }

    function renderFile(file) {
      const wrap = document.createElement('div');
      wrap.className = 'file';

      const nameEl = document.createElement('div');
      nameEl.className = 'file-name';
      const ic = document.createElement('span');
      ic.className = 'file-icon';
      ic.textContent = iconFor(file.type);
      const txt = document.createElement('span');
      txt.textContent = file.name || '檔案';
      nameEl.appendChild(ic);
      nameEl.appendChild(txt);
      wrap.appendChild(nameEl);

      // encodeURI keeps Traditional Chinese filenames valid in URLs.
      const url = encodeURI(file.path || '');
      const baseName = (file.path || '').split('/').pop();

      if (file.type === 'image') {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = url;
        img.alt = file.name || '樂譜';
        img.loading = 'lazy';
        img.onerror = () => { img.style.display = 'none'; };
        wrap.appendChild(img);
      } else if (file.type === 'video') {
        const v = document.createElement('video');
        v.className = 'preview';
        v.controls = true;
        v.playsInline = true;        // iOS: play inline, not forced fullscreen
        v.preload = 'metadata';
        v.src = url;
        v.onerror = () => { v.style.display = 'none'; };
        wrap.appendChild(v);
      }

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.appendChild(actionButton('開啟', url, false));
      actions.appendChild(actionButton('下載', url, true, baseName));
      wrap.appendChild(actions);
      return wrap;
    }

    function renderLesson(lesson) {
      const card = document.createElement('article');
      card.className = 'lesson';

      const head = document.createElement('div');
      head.className = 'lesson-head';
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '第 ' + (lesson.lesson ?? '') + ' 課';
      head.appendChild(badge);
      if (lesson.date) {
        const d = document.createElement('span');
        d.className = 'date';
        d.textContent = lesson.date;
        head.appendChild(d);
      }
      card.appendChild(head);

      if (lesson.title) {
        const t = document.createElement('h2');
        t.className = 'lesson-title';
        t.textContent = lesson.title;
        card.appendChild(t);
      }
      if (lesson.description) {
        const p = document.createElement('p');
        p.className = 'lesson-desc';
        p.textContent = lesson.description;
        card.appendChild(p);
      }

      const files = document.createElement('div');
      files.className = 'files';
      (lesson.files || []).forEach((f) => files.appendChild(renderFile(f)));
      card.appendChild(files);
      return card;
    }

    // ----- Sidebar + selection -----
    function buildNav() {
      nav.innerHTML = '';
      lessons.forEach((lesson, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'nav-item' + (i === activeIndex ? ' active' : '');
        b.setAttribute('aria-current', i === activeIndex ? 'true' : 'false');

        const n = document.createElement('span');
        n.className = 'n';
        n.textContent = '第 ' + (lesson.lesson ?? '') + ' 課';
        const ti = document.createElement('span');
        ti.className = 'ti';
        ti.textContent = lesson.title || '';
        b.appendChild(n);
        b.appendChild(ti);
        if (lesson.date) {
          const dt = document.createElement('span');
          dt.className = 'dt';
          dt.textContent = lesson.date;
          b.appendChild(dt);
        }
        b.addEventListener('click', () => select(i));
        nav.appendChild(b);
      });
    }

    function select(i) {
      activeIndex = i;
      Array.from(nav.children).forEach((c, idx) => {
        const on = idx === i;
        c.classList.toggle('active', on);
        c.setAttribute('aria-current', on ? 'true' : 'false');
      });
      main.innerHTML = '';
      const inner = document.createElement('div');
      inner.className = 'main-inner';
      inner.appendChild(renderLesson(lessons[i]));
      main.appendChild(inner);

      // Keep a shareable/bookmarkable hash like #lesson-2.
      const hash = '#lesson-' + lessons[i].lesson;
      if (location.hash !== hash) history.replaceState(null, '', hash);

      if (isMobile()) closeDrawer();
      window.scrollTo(0, 0);
    }

    function showState(emoji, message) {
      main.innerHTML = '';
      const inner = document.createElement('div');
      inner.className = 'main-inner';
      const s = document.createElement('div');
      s.className = 'state';
      const big = document.createElement('span');
      big.className = 'big';
      big.textContent = emoji;
      s.appendChild(big);
      s.appendChild(document.createTextNode(message));
      inner.appendChild(s);
      main.appendChild(inner);
    }

    function start(rawLessons) {
      lessons = Array.isArray(rawLessons) ? rawLessons.slice() : [];
      if (lessons.length === 0) {
        nav.innerHTML = '';
        showState('🎸', '目前還沒有課程，敬請期待');
        return;
      }
      // Order by lesson number, newest (highest) first.
      lessons.sort((a, b) => (b.lesson || 0) - (a.lesson || 0));

      // Pick the lesson named in the URL hash (#lesson-N), else the newest.
      const want = (location.hash.match(/^#lesson-(\d+)$/) || [])[1];
      let idx = 0;
      if (want) {
        const found = lessons.findIndex((l) => String(l.lesson) === want);
        if (found >= 0) idx = found;
      }
      activeIndex = idx;
      buildNav();
      select(idx);
    }

    fetch('lessons.json', { cache: 'no-cache' })
      .then((res) => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then((data) => start(data.lessons))
      .catch(() => { nav.innerHTML = ''; showState('😢', '課程載入失敗，請稍後再試'); });
  </script>
</body>
</html>
