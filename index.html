<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- Mobile-first: fit to device width, allow pinch-zoom for sheet music -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="木吉他基礎班課程資料 — 投影片、樂譜、示範影片與調音教學">
  <title>木吉他基礎班 ｜ 祂的敬拜學院</title>
  <style>
    /* ---------- Design tokens (warm, wood-inspired palette, single accent) ---------- */
    :root {
      --accent: #C2691D;
      --accent-dark: #9E5114;
      --accent-soft: #F6E7D7;
      --bg: #FBF6F0;
      --card: #FFFFFF;
      --text: #2B2420;
      --muted: #8A7E74;
      --line: #ECE3D9;
      --radius: 16px;
      --shadow: 0 2px 10px rgba(74, 53, 36, 0.06), 0 1px 3px rgba(74, 53, 36, 0.05);
    }

    * { box-sizing: border-box; }

    /* Background lives on <html> so the whole viewport is always filled,
       even when a single lesson is shorter than the screen (fixes the
       iOS Safari "background cuts off partway down" issue). */
    html { background: var(--bg); }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;            /* fill the screen like a normal page */
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    .container { max-width: 820px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }

    /* ---------- Header / branding ---------- */
    header { text-align: center; padding: 34px 16px 22px; }
    header .academy { color: var(--accent); font-size: 0.95rem; font-weight: 600; letter-spacing: 0.12em; margin: 0 0 6px; }
    header .class-title { font-size: 1.9rem; font-weight: 800; margin: 0 0 8px; letter-spacing: 0.02em; }
    header .church { color: var(--muted); font-size: 0.9rem; margin: 0; }
    header .rule { width: 48px; height: 4px; border-radius: 2px; background: var(--accent); margin: 18px auto 0; }

    /* ---------- Upcoming events (rendered from lessons.json "events") ---------- */
    .events { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 18px; }
    .events-h { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 700; color: var(--accent-dark); margin: 0 0 10px; letter-spacing: 0.02em; }
    .event-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .event { display: flex; align-items: center; gap: 12px; }
    .event-date {
      flex: 0 0 auto; min-width: 74px; text-align: center;
      background: var(--accent-soft); color: var(--accent-dark);
      border-radius: 10px; padding: 5px 8px; line-height: 1.25;
    }
    .event-date .md { display: block; font-weight: 800; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
    .event-date .dow { display: block; font-size: 0.72rem; opacity: 0.85; }
    .event-title { font-weight: 600; }
    .event-note { color: var(--muted); font-size: 0.85rem; margin-left: 6px; }

    /* ---------- Lesson tabs (sticky strip under the header) ---------- */
    .tabs-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .lesson-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 16px;
      scrollbar-width: none;            /* Firefox */
      -webkit-overflow-scrolling: touch;
    }
    .lesson-tabs::-webkit-scrollbar { display: none; }  /* WebKit */
    .tab {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 8px 16px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .tab:hover { border-color: var(--accent); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    /* Reference tabs (e.g. tuning) read as "not a lesson". */
    .tab.util { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent-soft); }
    .tab.util.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ---------- Main / lesson card ---------- */
    main { padding: 20px 0 56px; }
    .lesson { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 16px; }
    .lesson-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
    .badge { display: inline-block; background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
    .date { color: var(--muted); font-size: 0.85rem; }
    .lesson-title { font-size: 1.35rem; font-weight: 800; margin: 8px 0 4px; text-wrap: balance; }
    .lesson-desc { color: #5c5249; margin: 0 0 16px; }

    /* ---------- File items ---------- */
    .files { display: flex; flex-direction: column; gap: 12px; }
    .file { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #FCFAF7; }
    .file-name { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; word-break: break-word; }
    .file-icon { font-size: 1.15rem; line-height: 1; }

    .thumb { display: block; width: 100%; max-height: 380px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
    video.preview { display: block; width: 100%; max-height: 440px; background: #000; border-radius: 10px; margin-bottom: 10px; }

    .actions { display: flex; gap: 10px; }
    .btn { flex: 1 1 0; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer; padding: 0 12px; transition: transform 0.04s ease, background 0.15s ease; }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-ghost { background: #fff; color: var(--accent-dark); border: 1.5px solid var(--accent); }
    .btn-ghost:hover { background: var(--accent-soft); }

    /* ---------- Tuning guide ---------- */
    .steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
    .step { counter-increment: step; position: relative; padding-left: 42px; }
    .step::before {
      content: counter(step);
      position: absolute; left: 0; top: 1px;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-weight: 800; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
    }
    .step h3 { font-size: 1.05rem; font-weight: 700; margin: 3px 0 6px; }
    .step p { margin: 0 0 8px; }
    .step ul.plain { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .step ul.plain li { padding-left: 16px; position: relative; }
    .step ul.plain li::before { content: "・"; position: absolute; left: 0; color: var(--accent); }
    .hint { background: #FCFAF7; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; color: #5c5249; }
    .hint b { color: var(--text); }

    /* String reference table */
    .table-wrap { overflow-x: auto; margin: 0 0 8px; }
    table.strings { width: 100%; border-collapse: collapse; font-size: 0.94rem; }
    table.strings th, table.strings td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    table.strings th { font-size: 0.82rem; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
    table.strings tr:last-child td { border-bottom: 0; }
    td.note-cell { font-weight: 800; color: var(--accent-dark); font-size: 1.1rem; letter-spacing: 0.06em; }
    td.thin { color: var(--muted); font-size: 0.86rem; }

    /* "How to read the needle" rows */
    .reading { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .reading li { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #FCFAF7; }
    .pip { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #fff; font-weight: 700; }
    .pip.low, .pip.high { background: #C0552F; }
    .pip.ok { background: #3E8E5A; }
    .reading .lead { font-weight: 700; display: block; }
    .reading .sub { font-size: 0.9rem; color: #5c5249; }

    .tuning-sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 4px; }
    .tuning-sum span { background: var(--accent); color: #fff; font-weight: 800; border-radius: 8px; padding: 4px 12px; font-size: 1rem; letter-spacing: 0.06em; }

    /* ---------- States ---------- */
    .state { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 1.05rem; }
    .state .big { font-size: 2.2rem; display: block; margin-bottom: 10px; }

    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 8px 16px 28px; }
  </style>
</head>
<body>
  <header>
    <p class="academy">祂的敬拜學院</p>
    <h1 class="class-title">木吉他基礎班 🎸</h1>
    <p class="church">龍潭聖潔會</p>
    <div class="rule"></div>
  </header>

  <!-- Upcoming events: filled in from lessons.json; stays hidden if nothing is coming up -->
  <div class="container" id="events-wrap" hidden>
    <section class="events" aria-labelledby="events-h">
      <h2 class="events-h" id="events-h">📅 近期活動</h2>
      <ul class="event-list" id="event-list"></ul>
    </section>
  </div>

  <!-- View switcher: a horizontal, scrollable tab strip (sticky on scroll) -->
  <div class="tabs-bar">
    <nav class="lesson-tabs" id="tabs" aria-label="課程切換"></nav>
  </div>

  <main aria-live="polite">
    <div class="container" id="main">
      <div class="state"><span class="big">🎵</span>課程載入中…</div>
    </div>
  </main>

  <footer>龍潭聖潔會 ・ 祂的敬拜學院</footer>

  <!-- Tuning guide: static reference content, cloned into <main> when its tab is picked. -->
  <template id="tuning-tpl">
    <article class="lesson">
      <div class="lesson-head"><span class="badge">🎸 調音教學</span></div>
      <h2 class="lesson-title">吉他怎麼調音？</h2>
      <p class="lesson-desc">每次練習前都先調音 — 音不準的話，再怎麼練手感都是錯的。第一次照著做大概五分鐘，熟了以後一分鐘就搞定。</p>

      <ol class="steps">
        <li class="step">
          <h3>下載調音 App</h3>
          <p>手機就是最好的調音器，不用另外買。</p>
          <ul class="plain">
            <li><b>iPhone／iPad</b>：打開 <b>App Store</b>，搜尋 <b>GuitarTuna</b></li>
            <li><b>Android</b>：打開 <b>Google Play 商店</b>，搜尋 <b>GuitarTuna</b></li>
          </ul>
          <p class="hint">免費、有中文介面。第一次打開會問「是否允許使用麥克風」，<b>一定要按允許</b>，不然它聽不到你的琴聲。<br>用 Fender Tune、Pano Tuner 也可以，畫面看法都差不多。</p>
        </li>

        <li class="step">
          <h3>認識六條弦叫什麼名字</h3>
          <p>標準調音（Standard Tuning）由<b>粗到細</b>是這六個音，我們課堂上用的就是這個：</p>
          <p class="tuning-sum"><span>E</span><span>A</span><span>D</span><span>G</span><span>B</span><span>E</span></p>
          <div class="table-wrap">
            <table class="strings">
              <thead><tr><th>弦</th><th>音名</th><th>怎麼認</th></tr></thead>
              <tbody>
                <tr><td>第 6 弦</td><td class="note-cell">E</td><td class="thin">最粗、最低音，抱著吉他時在<b>最上面</b></td></tr>
                <tr><td>第 5 弦</td><td class="note-cell">A</td><td class="thin">—</td></tr>
                <tr><td>第 4 弦</td><td class="note-cell">D</td><td class="thin">—</td></tr>
                <tr><td>第 3 弦</td><td class="note-cell">G</td><td class="thin">—</td></tr>
                <tr><td>第 2 弦</td><td class="note-cell">B</td><td class="thin">—</td></tr>
                <tr><td>第 1 弦</td><td class="note-cell">E</td><td class="thin">最細、最高音，在<b>最下面</b>（靠地板）</td></tr>
              </tbody>
            </table>
          </div>
          <p class="hint">注意：<b>最粗</b>的那條叫「第 6 弦」，<b>最細</b>的才是「第 1 弦」 — 很多人一開始會記反。第 6 弦和第 1 弦都是 E，只是差了兩個八度。</p>
        </li>

        <li class="step">
          <h3>看懂調音器畫面</h3>
          <p>打開 App，<b>一次只撥一條弦</b>。畫面中間會顯示它聽到的音名，下面有一根指針：</p>
          <ul class="reading">
            <li><span class="pip low">◀</span><div><span class="lead">指針偏左（常是紅色，或顯示 ♭）</span><span class="sub">音<b>太低</b>、弦太鬆 → 把弦鈕<b>鎖緊</b></span></div></li>
            <li><span class="pip ok">✓</span><div><span class="lead">指針置中、變綠色</span><span class="sub">這條準了，換下一條</span></div></li>
            <li><span class="pip high">▶</span><div><span class="lead">指針偏右（常是紅色，或顯示 ♯）</span><span class="sub">音<b>太高</b>、弦太緊 → 把弦鈕<b>放鬆</b></span></div></li>
          </ul>
          <p class="hint">先看<b>音名對不對</b>，再看指針。如果你在調第 6 弦，它卻顯示 A 或別的音，代表現在離目標還很遠，繼續轉到音名正確為止。</p>
        </li>

        <li class="step">
          <h3>轉弦鈕的訣竅</h3>
          <ul class="plain">
            <li>一邊<b>慢慢轉</b>、一邊反覆撥弦，聽聲音的變化</li>
            <li>不確定該往哪邊轉？先小小轉一點：<b>音變高</b>就是在鎖緊，<b>音變低</b>就是在放鬆</li>
            <li>一次只轉一點點 — 第 1、2 弦最細，轉太快很容易<b>斷弦</b></li>
            <li>從第 6 弦（最粗）開始，依序往第 1 弦調</li>
          </ul>
        </li>

        <li class="step">
          <h3>全部再檢查一遍</h3>
          <p>六條都調完後，回到第 6 弦<b>再檢查一次</b>。</p>
          <p class="hint">調某一條弦會改變琴頸的受力，讓其他弦跟著跑掉一點 — 所以第一輪調完通常會有幾條又不準了，<b>這是正常的</b>，再調一輪就好。剛換的新弦特別容易跑音，前幾天要多調幾次。</p>
        </li>
      </ol>
    </article>
  </template>

  <script>
    // ---------------------------------------------------------------------------
    // Church guitar lessons — static viewer.
    // Reads lessons.json, lists lessons (plus a tuning guide) as tabs, and shows
    // one view at a time. No framework, no backend.
    // UI strings Traditional Chinese; code English.
    // ---------------------------------------------------------------------------

    const tabs = document.getElementById('tabs');
    const main = document.getElementById('main');
    const eventsWrap = document.getElementById('events-wrap');
    const eventList = document.getElementById('event-list');
    const tuningTpl = document.getElementById('tuning-tpl');
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

    // views[] = the tab strip: one entry per lesson, then the tuning guide.
    let views = [];
    let activeIndex = 0;

    function iconFor(type) {
      switch (type) {
        case 'pdf': return '📄';
        case 'image': return '🖼️';
        case 'video': return '🎬';
        default: return '📎';
      }
    }

    // Parse YYYY-MM-DD as a *local* date, so no timezone shifts the day by one.
    function parseDate(str) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    }

    function actionButton(label, href, isDownload, downloadName) {
      const a = document.createElement('a');
      a.className = 'btn ' + (isDownload ? 'btn-primary' : 'btn-ghost');
      a.href = href;
      a.textContent = label;
      if (isDownload) {
        // Same-origin on GitHub Pages, so the browser saves to the device.
        a.setAttribute('download', downloadName || '');
      } else {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      return a;
    }

    function renderFile(file) {
      const wrap = document.createElement('div');
      wrap.className = 'file';

      const nameEl = document.createElement('div');
      nameEl.className = 'file-name';
      const ic = document.createElement('span');
      ic.className = 'file-icon';
      ic.textContent = iconFor(file.type);
      const txt = document.createElement('span');
      txt.textContent = file.name || '檔案';
      nameEl.appendChild(ic);
      nameEl.appendChild(txt);
      wrap.appendChild(nameEl);

      // encodeURI keeps Traditional Chinese filenames valid in URLs.
      const url = encodeURI(file.path || '');
      const baseName = (file.path || '').split('/').pop();

      if (file.type === 'image') {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = url;
        img.alt = file.name || '樂譜';
        img.loading = 'lazy';
        img.onerror = () => { img.style.display = 'none'; };
        wrap.appendChild(img);
      } else if (file.type === 'video') {
        const v = document.createElement('video');
        v.className = 'preview';
        v.controls = true;
        v.playsInline = true;        // iOS: play inline, not forced fullscreen
        v.preload = 'metadata';
        v.src = url;
        v.onerror = () => { v.style.display = 'none'; };
        wrap.appendChild(v);
      }

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.appendChild(actionButton('開啟', url, false));
      actions.appendChild(actionButton('下載', url, true, baseName));
      wrap.appendChild(actions);
      return wrap;
    }

    function renderLesson(lesson) {
      const card = document.createElement('article');
      card.className = 'lesson';

      const head = document.createElement('div');
      head.className = 'lesson-head';
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '第 ' + (lesson.lesson ?? '') + ' 課';
      head.appendChild(badge);
      if (lesson.date) {
        const d = document.createElement('span');
        d.className = 'date';
        d.textContent = lesson.date;
        head.appendChild(d);
      }
      card.appendChild(head);

      if (lesson.title) {
        const t = document.createElement('h2');
        t.className = 'lesson-title';
        t.textContent = lesson.title;
        card.appendChild(t);
      }
      if (lesson.description) {
        const p = document.createElement('p');
        p.className = 'lesson-desc';
        p.textContent = lesson.description;
        card.appendChild(p);
      }

      const files = document.createElement('div');
      files.className = 'files';
      (lesson.files || []).forEach((f) => files.appendChild(renderFile(f)));
      card.appendChild(files);
      return card;
    }

    // ---- Upcoming events -----------------------------------------------------
    // Anything already past drops off by itself, so the card never goes stale.
    function renderEvents(rawEvents) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const upcoming = (rawEvents || [])
        .map((e) => ({ ev: e, when: parseDate(e.date) }))
        .filter((x) => x.when && x.when >= today)
        .sort((a, b) => a.when - b.when);

      if (upcoming.length === 0) return;   // nothing coming up: leave the card hidden

      eventList.innerHTML = '';
      upcoming.forEach(({ ev, when }) => {
        const li = document.createElement('li');
        li.className = 'event';

        const dateEl = document.createElement('span');
        dateEl.className = 'event-date';
        const md = document.createElement('span');
        md.className = 'md';
        md.textContent = String(when.getMonth() + 1).padStart(2, '0') + '/' +
                         String(when.getDate()).padStart(2, '0');
        const dow = document.createElement('span');
        dow.className = 'dow';
        dow.textContent = WEEKDAYS[when.getDay()];
        dateEl.appendChild(md);
        dateEl.appendChild(dow);
        li.appendChild(dateEl);

        const body = document.createElement('div');
        const title = document.createElement('span');
        title.className = 'event-title';
        title.textContent = ev.title || '';
        body.appendChild(title);
        if (ev.note) {
          const note = document.createElement('span');
          note.className = 'event-note';
          note.textContent = ev.note;
          body.appendChild(note);
        }
        li.appendChild(body);

        eventList.appendChild(li);
      });

      eventsWrap.hidden = false;
    }

    // ---- Tabs / view switching -----------------------------------------------
    function buildTabs() {
      tabs.innerHTML = '';
      views.forEach((view, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tab' + (view.util ? ' util' : '') + (i === activeIndex ? ' active' : '');
        b.setAttribute('aria-current', i === activeIndex ? 'true' : 'false');
        b.textContent = view.label;
        b.addEventListener('click', () => select(i, true));
        tabs.appendChild(b);
      });
    }

    function select(i, userAction) {
      activeIndex = i;
      Array.from(tabs.children).forEach((c, idx) => {
        const on = idx === i;
        c.classList.toggle('active', on);
        c.setAttribute('aria-current', on ? 'true' : 'false');
      });

      main.innerHTML = '';
      main.appendChild(views[i].build());

      // Keep the active tab in view within the horizontal strip.
      const activeTab = tabs.children[i];
      if (activeTab) {
        activeTab.scrollIntoView({
          inline: 'center', block: 'nearest',
          behavior: userAction && !prefersReduced ? 'smooth' : 'auto',
        });
      }

      // Bookmarkable hash like #lesson-2 or #tuning.
      const hash = '#' + views[i].key;
      if (location.hash !== hash) history.replaceState(null, '', hash);
    }

    function showState(emoji, message) {
      tabs.innerHTML = '';
      main.innerHTML = '';
      const s = document.createElement('div');
      s.className = 'state';
      const big = document.createElement('span');
      big.className = 'big';
      big.textContent = emoji;
      s.appendChild(big);
      s.appendChild(document.createTextNode(message));
      main.appendChild(s);
    }

    function start(data) {
      renderEvents(data.events);

      const lessons = Array.isArray(data.lessons) ? data.lessons.slice() : [];
      // Order by lesson number, newest (highest) first.
      lessons.sort((a, b) => (b.lesson || 0) - (a.lesson || 0));

      views = lessons.map((lesson) => ({
        key: 'lesson-' + lesson.lesson,
        label: '第 ' + (lesson.lesson ?? '') + ' 課',
        build: () => renderLesson(lesson),
      }));

      // Tuning guide is always available, pinned after the lessons.
      views.push({
        key: 'tuning',
        label: '🎸 調音教學',
        util: true,
        build: () => tuningTpl.content.cloneNode(true),
      });

      if (views.length === 1) {   // tuning guide only — no lessons published yet
        showState('🎸', '目前還沒有課程，敬請期待');
        return;
      }

      // Honour the URL hash (#lesson-N or #tuning), else show the newest lesson.
      const wanted = location.hash.slice(1);
      const found = views.findIndex((v) => v.key === wanted);
      activeIndex = found >= 0 ? found : 0;

      buildTabs();
      select(activeIndex, false);
    }

    fetch('lessons.json', { cache: 'no-cache' })
      .then((res) => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(start)
      .catch(() => showState('😢', '課程載入失敗，請稍後再試'));
  </script>
</body>
</html>
